  <!-- Los cursos de arriba son enlaces fijos para mantener el diseño; este script
       quita de la lista los que ya no estan publicados en Lynkia (ocultos, archivados
       o borrados), igual que hace el catalogo en vivo. Si la consulta falla, no toca nada. -->
  <script>
    (function () {
      var list = document.querySelector("[data-courses]");
      if (!list) return;
      fetch("https://api.lynkia.app/private-content/public/barbaracocinamexicana?for_website=true")
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (items) {
          if (!Array.isArray(items)) return;
          var live = items.map(function (item) { return item.id; });
          list.querySelectorAll("[data-lynkia-course]").forEach(function (row) {
            if (live.indexOf(row.getAttribute("data-lynkia-course")) === -1) row.remove();
          });
          if (!list.querySelector("[data-lynkia-course]")) {
            list.insertAdjacentHTML("beforeend", '<p class="rows__empty">Muy pronto, nuevos cursos por aquí.</p>');
          }
        })
        .catch(function () {});
    })();
  </script>
